[project]
name = "splat-trainer"
version = "1.0.0"
description = "Deco 3DGS Training Server - Train 3D Gaussian Splatting models from iOS scan data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.1",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "plyfile>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "trimesh>=4.0.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.1.0",
    "torchvision",
    "gsplat",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "httpx>=0.25.0",
    "pytest-asyncio>=0.21.0",
]
